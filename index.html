<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f4a43">
<meta name="description" content="그림과 글을 누르면 소리가 나는 공룡 그림책 12권">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공룡책">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>터치 공룡 그림책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: jungle-green shelf of covers -> reader. Portrait: one page, picture on top, big text below, turns on the left spine.
     Landscape: an open book, picture on the left page, text on the right page, the leaf turns over the middle. */
  --jungle:#0f4a43; --jungle-deep:#0a332f; --leaf:#bfe86b;
  --paper:#fffaf0; --ink:#25323a; --pop:#ff3d8b; --sun:#ffc93c;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--jungle);color:var(--paper);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  background-image:radial-gradient(circle at 15% 0%,#1a6a5c 0,transparent 45%),radial-gradient(circle at 100% 100%,var(--jungle-deep) 0,transparent 55%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
[hidden]{display:none!important}

/* shelf */
#shelf{height:100%;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#shelf header{max-width:720px;margin:0 auto 16px}
#shelf h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,9vw,52px);margin:0;line-height:1.1;color:var(--leaf);display:inline-block}
#shelf header p{margin:6px 0 0;font-size:18px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 16px;max-width:720px;margin:0 auto}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;aspect-ratio:4/5;padding:10px 10px 12px 18px;
  background:var(--cv);color:var(--ink);border-radius:5px 14px 14px 5px;text-align:center;
  box-shadow:3px 3px 0 #f1e8d2,6px 6px 0 #d8ccb0,10px 14px 18px rgba(0,0,0,.35);transition:transform .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:5px 0 0 5px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.card:active{transform:scale(.96) rotate(-1deg)}
.card svg{flex:1;min-height:0;width:100%}
.card b{font-family:var(--font-display);font-weight:400;font-size:clamp(14px,3.9vw,22px);line-height:1.2;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.card i{font-style:normal;font-size:clamp(12px,3.2vw,15px);font-weight:700;opacity:.75;letter-spacing:.02em}
#voiceBox{max-width:720px;margin:26px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:16px}
#voiceBox label{flex:1 0 100%;font-family:var(--font-display);color:var(--leaf);font-size:18px}
#voiceSel{flex:1;min-width:0;height:44px;border:0;border-radius:22px;padding:0 14px;font:inherit;background:#fff;color:var(--ink)}
#note{max-width:720px;margin:22px auto 0;font-size:14px;opacity:.75}

/* reader */
#reader{height:100%;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.14);font-family:var(--font-display);font-size:17px}
.pill svg{width:22px;height:22px}
.pill[aria-pressed="false"]{opacity:.55}
#pg{font-family:var(--font-display);font-size:18px;color:var(--leaf)}
.stage{flex:1;min-height:0;display:grid;place-items:center}
.book{position:relative;perspective:1800px;--u:3.6px}
.book::before{content:"";position:absolute;inset:0;border-radius:6px 16px 16px 6px;background:#efe6cf;
  box-shadow:3px 3px 0 #e6dcc2,6px 6px 0 #d6caac,9px 9px 0 #c8bb9b,14px 20px 26px rgba(0,0,0,.4)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  border-radius:6px 16px 16px 6px;overflow:hidden;transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*5);z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(60,40,10,.3),rgba(60,40,10,.06) 60%,transparent)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.5))}
.page.out{z-index:3;animation:pout .55s ease-in forwards}
.page.in{z-index:3;animation:pin .55s ease-out}
.page.out .shade{animation:sh .55s ease-in forwards}
.page.in .shade{animation:sh .55s ease-out reverse}
@keyframes pout{to{transform:rotateY(-96deg)}}
@keyframes pin{from{transform:rotateY(-96deg)}}
@keyframes sh{to{opacity:1}}
/* landscape: the book lies open. Left page = picture, right page = words, and only the right-hand leaf turns over the middle. */
#reader.wide{display:grid;grid-template-columns:auto 1fr auto auto auto 1fr auto;grid-template-rows:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding-top:max(8px,env(safe-area-inset-top))}
#reader.wide .bar,#reader.wide .ctl{display:contents}
#reader.wide .stage{grid-area:1/1/2/-1;align-self:stretch}
#reader.wide #home{grid-area:2/1}#reader.wide #pg{grid-area:2/2;justify-self:center}
#reader.wide #prev{grid-area:2/3}#reader.wide #read{grid-area:2/4}#reader.wide #next{grid-area:2/5}#reader.wide #auto{grid-area:2/7}
.wide .nav{width:52px;height:52px;box-shadow:0 4px 0 #c9951a}.wide .nav svg{width:28px;height:28px}
.wide .read{height:52px;font-size:19px;box-shadow:0 4px 0 #b81f5c}
.wide .book::before,.wide .page{border-radius:14px}
.wide .page{flex-direction:row}
.wide .page::before{left:50%;width:calc(var(--u)*12);transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(60,40,10,.16) 35%,rgba(60,40,10,.38) 50%,rgba(60,40,10,.16) 65%,transparent)}
.wide .scene{flex:0 0 50%;aspect-ratio:auto;height:100%}
.wide .story{padding:calc(var(--u)*6) calc(var(--u)*9) calc(var(--u)*10) calc(var(--u)*12)}
.wide .txt{font-size:calc(var(--u)*9)}
.wide .txt.long{font-size:calc(var(--u)*7.2)}
.wide .num{left:50%}
.wide .cover{position:relative;padding-left:calc(50% + var(--u)*10)}
.wide .cover svg{position:absolute;left:0;top:0;width:50%;height:100%;padding:calc(var(--u)*6) calc(var(--u)*7)}
.hl{clip-path:inset(0 50% 0 0)}.hr{clip-path:inset(0 0 0 50%)}
.leaf{position:absolute;inset:0;z-index:5;pointer-events:none;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform-origin:50% 50%}
.leaf .page{transform-origin:50% 50%}.leaf .back{transform:rotateY(180deg)}
.leaf.fw{animation:lfw .65s ease-in-out forwards}.leaf.bw{animation:lbw .65s ease-in-out forwards}
@keyframes lfw{to{transform:rotateY(-180deg)}}
@keyframes lbw{to{transform:rotateY(180deg)}}

.scene{position:relative;flex:0 0 auto;aspect-ratio:4/3;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.badge{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*3);display:flex;flex-direction:column;align-items:flex-start;
  padding:calc(var(--u)*1.2) calc(var(--u)*3.2);background:#fff;color:var(--ink);border-radius:calc(var(--u)*3.5);
  box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.18);line-height:1.1}
.badge b{font-family:var(--font-display);font-weight:400;font-size:calc(var(--u)*6);letter-spacing:.01em}
.badge small{font-size:calc(var(--u)*3.2);opacity:.7;font-weight:700}
.story{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*6) calc(var(--u)*10)}
.txt{border-radius:calc(var(--u)*2);margin:0;font-family:var(--font-display);font-size:calc(var(--u)*7.4);line-height:1.42;word-break:keep-all;text-wrap:balance}
.txt.long{font-size:calc(var(--u)*6.3)}
.txt span{border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*1);margin:0 calc(var(--u)*-1);transition:background .2s}
.txt span.on,.txt.on,.say.on{background:var(--sun)}
.num{position:absolute;left:0;right:0;bottom:calc(var(--u)*2);text-align:center;font-family:var(--font-display);font-size:calc(var(--u)*4);opacity:.45}
.curl{position:absolute;right:0;bottom:0;width:calc(var(--u)*15);height:calc(var(--u)*15);z-index:3;
  background:linear-gradient(135deg,transparent 50%,#e4d8ba 50%,#fff 78%,#d9ccab);border-top-left-radius:calc(var(--u)*3);
  filter:drop-shadow(-2px -2px 3px rgba(0,0,0,.2));animation:peek 2.4s ease-in-out infinite;transform-origin:100% 100%}
@keyframes peek{0%,70%,100%{transform:scale(1)}85%{transform:scale(1.25)}}

.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);
  padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--u)*8) calc(var(--u)*10);background:var(--cv);text-align:center}
.cover svg{width:100%;flex:1;min-height:0}
.cover h2{margin:0;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--font-display);font-weight:400;font-size:calc(var(--u)*10.5);line-height:1.18;text-wrap:balance;border-radius:calc(var(--u)*2)}
.cover h2.long{font-size:calc(var(--u)*8.6)}
.cover .en{font-family:var(--font-display);font-size:calc(var(--u)*6.2);background:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1) calc(var(--u)*4);box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.18)}
.cover .hint{font-size:calc(var(--u)*4);font-weight:700;opacity:.7}
.cover .big{font-family:var(--font-display);font-size:calc(var(--u)*20);color:var(--pop);line-height:1;-webkit-text-stroke:calc(var(--u)*.6) #fff;paint-order:stroke fill}
.endbtn{font-family:var(--font-display);font-size:calc(var(--u)*6.4);background:#fff;border-radius:calc(var(--u)*6);padding:calc(var(--u)*2.4) calc(var(--u)*7);box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.2);min-width:70%}

.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.nav{width:64px;height:64px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;box-shadow:0 5px 0 #c9951a}
.nav:active,.read:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.nav svg{width:34px;height:34px}
.nav:disabled{opacity:.3}
.read{height:64px;padding:0 22px;border-radius:32px;background:var(--pop);color:#fff;font-family:var(--font-display);font-size:22px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 5px 0 #b81f5c}
.read svg{width:28px;height:28px}

/* tappable art */
.tapg{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
.tapg.hit{animation:hit .6s ease-out}
.tapg.oc,.tapg.a-flip{transform-origin:50% 50%}
.a-jump{animation:hit .6s ease-out}.a-wiggle{animation:wiggle .6s ease-in-out}.a-stomp{animation:stompy .55s ease-out}.a-flip{animation:flip .75s ease-in-out}
.a-spin{animation:spin .9s ease-in-out}.a-sway{animation:sway .9s ease-in-out}.a-roll{animation:roll .7s ease-in-out}.a-wobble{animation:wobble .55s ease-in-out}
.a-bite{animation:bite .5s ease-out}.a-leap{animation:leap .8s ease-in-out}.a-flyaway{animation:flyaway 1.1s ease-in-out}.a-drift{animation:drift 1.1s ease-in-out}
.a-squish{animation:squish .5s ease-out}.a-bounce{animation:bounce .7s ease-out}.a-beat{animation:beat .7s ease-out}.a-erupt{animation:erupt .7s ease-out}
.a-twinkle{animation:twinkle .7s ease-in-out}.a-wave{animation:wave 1s ease-in-out}.a-glow{animation:glow .8s ease-in-out}.a-flow{animation:flow .9s linear}
@keyframes wiggle{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes stompy{30%{transform:translateY(-7%)}55%{transform:scale(1.08,.84)}75%{transform:translateY(-3%)}}
@keyframes flip{50%{transform:translateY(-14%) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes spin{50%{transform:rotate(180deg) scale(1.25)}100%{transform:rotate(360deg)}}
@keyframes sway{25%{transform:rotate(8deg)}50%{transform:rotate(-7deg)}75%{transform:rotate(4deg)}}
@keyframes roll{50%{transform:translateX(18px) rotate(22deg)}}
@keyframes wobble{15%{transform:rotate(-13deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
@keyframes bite{40%{transform:scale(.65) rotate(-8deg)}}
@keyframes leap{40%{transform:translateY(-48px) rotate(-28deg)}80%{transform:translateY(4px) rotate(12deg)}}
@keyframes flyaway{50%{transform:translate(38px,-46px) rotate(14deg)}}
@keyframes drift{50%{transform:translateX(30px)}}
@keyframes squish{40%{transform:scale(1.15,.55)}}
@keyframes bounce{25%{transform:translateY(-24px)}50%{transform:none}72%{transform:translateY(-11px)}}
@keyframes beat{20%{transform:scale(1.45)}40%{transform:scale(1)}60%{transform:scale(1.3)}}
@keyframes erupt{15%{transform:scale(1.04,1.1)}35%{transform:translateX(-4px) scale(1.02,1.06)}55%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes twinkle{50%{transform:scale(2) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes wave{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes glow{50%{transform:scale(1.14)}}
@keyframes flow{25%{transform:translateY(6px)}50%{transform:none}75%{transform:translateY(6px)}}
.bit{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:bit .85s ease-out forwards}
@keyframes bit{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(160deg)}}
.fx.tapg{transform-origin:50% 50%;animation:pulse 1.6s ease-in-out infinite}
.fx.tapg.hit{animation:boom .5s ease-out}
.hit:not(.tapg){animation:boom .45s ease-out}
@keyframes hit{0%{transform:none}30%{transform:translateY(-9%) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
@keyframes pulse{50%{transform:scale(1.08) rotate(2deg)}}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
.wing{transform-box:fill-box;animation:flap .7s ease-in-out infinite alternate}
.wl{transform-origin:100% 75%}.wr{transform-origin:0% 75%}
.wl{--r:14deg}.wr{--r:-14deg}
@keyframes flap{to{transform:rotate(var(--r)) scaleY(.8)}}
.flutter{transform-box:fill-box;transform-origin:50% 50%;animation:flut 1.8s ease-in-out infinite alternate}
@keyframes flut{to{transform:translate(14px,-10px) rotate(10deg)}}
.rain{animation:fall .5s linear infinite}
@keyframes fall{to{transform:translate(-8px,40px)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@media(prefers-reduced-motion:reduce){.page.out,.page.in,.fx.tapg,.wing,.flutter,.curl{animation-duration:.01s;animation-iteration-count:1}}
</style>
</head>
<body>

<main id="shelf">
  <header>
    <h1 class="say" data-tap data-say="공룡 책장">공룡 책장</h1>
    <p>읽고 싶은 책을 콕 눌러요</p>
  </header>
  <div class="grid" id="grid"></div>
  <div id="voiceBox" hidden>
    <label for="voiceSel">읽어주는 목소리</label>
    <select id="voiceSel"></select>
    <button class="pill" id="voiceTry">들어 보기</button>
  </div>
  <p id="note" hidden>이 기기는 글 읽어주기 목소리를 지원하지 않아요. 효과음은 나와요.</p>
</main>

<section id="reader" hidden>
  <div class="bar">
    <button class="pill" id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>책장</button>
    <span id="pg"></span>
    <button class="pill" id="auto" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg><span id="autoT">자동 읽기</span></button>
  </div>
  <div class="stage" id="stage"><div class="book" id="book"></div></div>
  <div class="ctl">
    <button class="nav" id="prev" aria-label="앞 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="read" id="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/><path d="M19.5 6.5a8 8 0 0 1 0 11"/></svg>읽어 줘</button>
    <button class="nav" id="next" aria-label="다음 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</section>

<script id="art">
/* ---------- drawing ---------- */
const INK='#25323a', BONE='#fff3d6';
const eye=(x,y,r,z)=>z?`<path d="M${x-r} ${y} q${r} ${r*.9} ${2*r} 0" fill="none" stroke="${INK}" stroke-width="${r*.45}" stroke-linecap="round"/>`
 :`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x+r*.22}" cy="${y+r*.1}" r="${r*.58}" fill="${INK}"/><circle cx="${x+r*.45}" cy="${y-r*.2}" r="${r*.2}" fill="#fff"/>`;
const cheek=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#ff8fa3" opacity=".6"/>`;
const mouth=(x,y,o,w=16)=>o?`<ellipse cx="${x+w/2}" cy="${y+2}" rx="${w*.5}" ry="${w*.36}" fill="#8c2f39"/>`
 :`<path d="M${x} ${y} q${w/2} ${w*.4} ${w} -1" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
const leg=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.45}" fill="${f}"/>`;

const ART={
trex:{w:240,h:176,draw(b,o){const {c,d,l}=b;let t='';
  for(const x of [178,188,198,207]){const y=80-(x-168)*.13;t+=`<path d="M${x} ${y} l3.5 8 l4 -9z" fill="#fff"/>`}
  return `<path d="M95 92 Q45 84 6 112 Q50 128 100 140Z" fill="${c}"/>
  ${leg(124,128,20,40,d)}<ellipse cx="138" cy="169" rx="17" ry="7" fill="${d}"/>
  <ellipse cx="118" cy="108" rx="46" ry="40" transform="rotate(-18 118 108)" fill="${c}"/>
  <ellipse cx="132" cy="118" rx="24" ry="26" transform="rotate(-18 132 118)" fill="${l}"/>
  <path d="M126 82 Q138 50 160 44 L188 80 Q168 102 150 112Z" fill="${c}"/>
  <path d="M84 84 l8 -12 l6 12z M66 90 l7 -11 l6 12z M48 97 l6 -10 l6 12z" fill="${d}"/>

 flip(){noise(1400,4200,0,.2,.6)}
};
function play(n,pt){try{(SND[n]||SND.pop)(pt)}catch(e){}}

/* ---------- recorded voice: audio/<book id>/<NN>.m4a (00 = title, 01-10 = pages, 11 = the end) ---------- */
const REC={};let recNode=null,recTok=0;
function stopRec(){recTok++;if(recNode){try{recNode.onended=null;recNode.stop()}catch(e){}recNode=null}}
function playRec(key,el,delay,fallback){const url=REC[key];if(!url)return false;hush();const tok=recTok;
  fetch(url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((ok,no)=>ac().decodeAudioData(b,ok,no))).then(buf=>{if(tok!==recTok)return;
    const a=ac(),n=a.createBufferSource();n.buffer=buf;n.connect(a.destination);recNode=n;
    if(el){lit=el;el.classList.add('on')}
    n.onended=()=>{if(el)el.classList.remove('on');if(lit===el)lit=null;if(recNode===n)recNode=null};
    n.start(a.currentTime+(delay||0)/1000)}).catch(()=>{if(tok===recTok)fallback()});
  return true}
fetch('audio/index.json').then(r=>r.ok?r.json():[]).then(list=>{
  list.forEach(f=>{const m=/^([a-z]+)\/(\d\d)\.\w+$/.exec(f);if(m)REC[m[1]+'/'+m[2]]='audio/'+f});
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(async()=>{for(const k in REC){try{await fetch(REC[k])}catch(e){}}})}).catch(()=>{});

/* ---------- voice ---------- */
const synth=window.speechSynthesis;let voices=[],lit=null,sayT=0,koPick='';
try{koPick=localStorage.getItem('dino-voice')||''}catch(e){}
/* prefer the most natural-sounding voice the device has */
const vscore=v=>{const n=v.name.toLowerCase();let s=0;if(/premium|프리미엄/.test(n))s+=5;if(/enhanced|고품질|natural|neural/.test(n))s+=4;if(/siri/.test(n))s+=4;if(/google/.test(n))s+=3;if(/online/.test(n))s+=2;if(/yuna|유나|sunhi|선히/.test(n))s+=1;if(/compact|espeak/.test(n))s-=2;return s};
function best(lang){const l=lang.slice(0,2),c=voices.filter(v=>v.lang.slice(0,2)===l);if(!c.length)return null;
  if(l==='ko'&&koPick){const k=c.find(v=>v.name===koPick);if(k)return k}
  /* no pick: use a clearly high-quality voice if listed, otherwise leave it to the phone's own default voice for the language */
  const top=c.slice().sort((a,b)=>vscore(b)-vscore(a))[0];return vscore(top)>=4?top:null}
function fillVoices(){const ko=voices.filter(v=>v.lang.slice(0,2)==='ko').sort((a,b)=>vscore(b)-vscore(a));
  if(koPick&&!ko.some(v=>v.name===koPick))koPick='';
  document.getElementById('voiceBox').hidden=!ko.length;
  document.getElementById('voiceSel').innerHTML='<option value="">자동 (폰 설정에서 고른 목소리)</option>'+ko.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}"${koPick===v.name?' selected':''}>${v.name}</option>`).join('')}
function loadV(){try{voices=synth.getVoices()}catch(e){}fillVoices()}
if(synth){loadV();try{synth.addEventListener('voiceschanged',loadV)}catch(e){}}else document.getElementById('note').hidden=false;
function hush(){stopRec();clearTimeout(sayT);if(lit){lit.classList.remove('on');lit=null}if(synth)try{synth.cancel()}catch(e){}}
/* text: a string, or a list of [sentence, element] spoken one by one with a natural pause between */
function speak(text,lang,el,delay){hush();if(!synth||!text)return;
  const list=Array.isArray(text)?text:[[text,el]];
  const go=()=>{const v=best(lang),ko=lang.slice(0,2)==='ko';list.forEach(([t,e])=>{try{const u=new SpeechSynthesisUtterance(t);u.lang=lang;if(v)u.voice=v;
    u.rate=ko?.92:.8;u.pitch=1;
    if(e){u.onstart=()=>{lit=e;e.classList.add('on')};u.onend=u.onerror=()=>{e.classList.remove('on');if(lit===e)lit=null}}
    synth.speak(u)}catch(x){}})};
  delay?sayT=setTimeout(go,delay):go()}

/* ---------- pages ---------- */
const $=id=>document.getElementById(id),bookEl=$('book'),LAST=11;
let cur=null,idx=0,busy=false,auto=true,pageNow=null;
try{auto=localStorage.getItem('dino-auto')!=='0'}catch(e){}
const badge=b=>`<button class="badge" data-tap data-en="${b.en}"><b>${b.en}</b><small>${b.ko}</small></button>`;
function pageEl(b,i){const el=document.createElement('div');el.className='page';let h;
  if(i===0)h=`<div class="cover" style="--cv:${b.cv}"><span class="en" data-tap data-en="${b.en}">${b.en}</span>${portrait(b)}<h2 class="say${b.title.length>17?' long':''}" data-tap data-say="${b.title}">${b.title}</h2><span class="hint">그림과 글을 콕 눌러 보세요</span></div><button class="curl" data-next aria-label="다음 장"></button>`;
  else if(i===LAST)h=`<div class="cover" style="--cv:${b.cv}"><span class="big say" data-tap data-snd="sparkle" data-say="끝! 참 잘했어요.">끝!</span>${portrait(b,{o:1})}<button class="endbtn" data-again>처음부터 다시 읽기</button><button class="endbtn" data-home>다른 책 고르기</button></div>`;
  else{const p=b.pages[i-1],parts=p.t.match(/[^.!?]+[.!?]+”?/g)||[p.t];
    h=`<div class="scene">${scene(b,p)}${badge(b)}</div><div class="story"><p class="txt${p.t.length>30?' long':''}">${parts.map(s=>`<span data-tap data-say="${s.trim()}">${s.trim()}</span>`).join(' ')}</p></div><span class="num">${i}</span><button class="curl" data-next aria-label="다음 장"></button>`}
  el.innerHTML=h+'<div class="shade"></div>';return el}
function pageText(){if(idx===0)return cur.title;if(idx===LAST)return '끝! 참 잘했어요.';return cur.pages[idx-1].t}
const recKey=()=>cur.id+'/'+String(idx).padStart(2,'0');
function readPage(delay){const pg=pageNow;if(!pg)return;const sp=[...pg.querySelectorAll('.txt span')];
  const tts=()=>{if(sp.length)speak(sp.map(s=>[s.getAttribute('data-say'),s]),'ko-KR',null,delay);else speak(pageText(),'ko-KR',pg.querySelector('h2,.big'),delay)};
  if(!playRec(recKey(),pg.querySelector('.txt,h2,.big'),delay,tts))tts()}
function chrome(){$('pg').textContent=idx===0?'표지':idx===LAST?'끝':idx+' / 10';$('prev').disabled=idx===0;$('next').disabled=idx===LAST}
let flipId=0;
/* after a turn: exactly one page stays, the newest one */
function settle(nu){busy=false;[...bookEl.children].forEach(p=>{if(p!==nu)p.remove()});nu.classList.remove('in','hl','hr')}
function show(i,dir){if(busy||i<0||i>LAST)return;const old=pageNow&&pageNow.parentNode===bookEl?pageNow:null,nu=pageEl(cur,i),id=++flipId;idx=i;pageNow=nu;chrome();
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!old||!dir||still){bookEl.innerHTML='';bookEl.appendChild(nu);busy=false}
  else{busy=true;play('flip');
    /* only the newest turn may tidy up; an older turn's timer must never remove a newer page */
    const done=()=>{if(id===flipId)settle(nu)};let mover=dir>0?old:nu;
    if(wide){/* open book: the new spread lies underneath, the old one keeps the half that stays put, and one leaf (old page on the front, new page on the back) swings over the middle */
      const a=dir>0?'hr':'hl',z=dir>0?'hl':'hr',f=old.cloneNode(true),k=nu.cloneNode(true);mover=document.createElement('div');mover.className='leaf '+(dir>0?'fw':'bw');
      f.className='page '+a;k.className='page back '+z;mover.append(f,k);[...bookEl.children].forEach(p=>{if(p!==old)p.remove()});
      bookEl.insertBefore(nu,old);old.classList.remove('in','out','hl','hr');old.classList.add(z);bookEl.appendChild(mover)}
    else if(dir>0){bookEl.insertBefore(nu,old);old.classList.add('out')}else{bookEl.appendChild(nu);nu.classList.add('in')}
    mover.addEventListener('animationend',e=>{if(e.target===mover)done()});
    setTimeout(done,900)}
  if(auto)readPage(dir?500:0);else speak('','ko-KR')}
let wide=false;
/* portrait: one 4:5 page. landscape: an open 8:3 book, two 4:3 pages side by side */
function fit(){wide=innerWidth>innerHeight*1.15;$('reader').classList.toggle('wide',wide);
  const s=$('stage').getBoundingClientRect(),r=wide?.375:1.25,w=Math.max(180,Math.min(s.width-12,(s.height-14)/r));
  bookEl.style.width=w+'px';bookEl.style.height=w*r+'px';bookEl.style.setProperty('--u',w/(wide?200:100)+'px')}
function openBook(b){busy=false;flipId++;pageNow=null;bookEl.innerHTML='';cur=b;$('shelf').hidden=true;$('reader').hidden=false;fit();play('hello');show(0,0)}
function goHome(){busy=false;flipId++;pageNow=null;speak('','ko-KR');$('reader').hidden=true;$('shelf').hidden=false;bookEl.innerHTML=''}
function setAuto(v){auto=v;$('auto').setAttribute('aria-pressed',v);$('autoT').textContent=v?'자동 읽기 켬':'자동 읽기 끔';try{localStorage.setItem('dino-auto',v?'1':'0')}catch(e){}}

/* shelf */
BOOKS.forEach(b=>{const c=document.createElement('button');c.className='card';c.style.setProperty('--cv',b.cv);
  c.innerHTML=portrait(b).replace(/ data-tap/g,'')+`<b>${b.title}</b><i>${b.en}</i>`;c.onclick=()=>openBook(b);$('grid').appendChild(c)});
setAuto(auto);
$('voiceSel').onchange=e=>{koPick=e.target.value;try{localStorage.setItem('dino-voice',koPick)}catch(x){}speak('안녕! 우리 같이 공룡 책 읽자.','ko-KR')};
$('voiceTry').onclick=()=>speak('안녕! 우리 같이 공룡 책 읽자.','ko-KR');

/* pictures: action + sound effect + a burst of little bits (no speech) */
const NS='http://www.w3.org/2000/svg',DOT='M-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0Z',TEAR='M0 -7 Q6 3 0 6 Q-6 3 0 -7Z',LEAF='M0 -7 Q7 0 0 7 Q-7 0 0 -7Z';
/* [colour, shape, 0 all around | 1 falling | 2 shooting up | 3 low and sideways] */
const BIT={star:['#ffd23f','M0 -7 L2 -2 L7 -2 L3 1.5 L4.5 7 L0 3.5 L-4.5 7 L-3 1.5 L-7 -2 L-2 -2Z',0],leaf:['#3fa55a',LEAF,1],petal:['#ff7eb6',LEAF,1],drop:['#5cc0f2',TEAR,2],rain:['#5cc0f2',TEAR,1],bubble:['#e6f7ff',DOT,2],
  dust:['#e9e0cf',DOT,3],lava:['#ff5a36',DOT,2],mud:['#8a5a3c',DOT,2],crumb:['#c8553d',DOT,0],heart:['#ff3d8b','M0 6 C-14 -4 -7 -14 0 -7 C7 -14 14 -4 0 6Z',2]};
function burst(svg,x,y,kind){const [c,d,m]=BIT[kind]||BIT.star,s=svg.viewBox.baseVal.width/400,R=Math.random;
  for(let i=0;i<7;i++){const a=R()*6.28,r=28+R()*30;let dx=Math.cos(a)*r,dy=Math.sin(a)*r;
    if(m===1){dx=(R()-.5)*50;dy=30+R()*50}if(m===2){dx=(R()-.5)*70;dy=-(35+R()*55)}if(m===3){dx=(R()-.5)*110;dy=-R()*18}
    const g=document.createElementNS(NS,'g'),p=document.createElementNS(NS,'path');
    g.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);g.setAttribute('pointer-events','none');
    p.setAttribute('d',d);p.setAttribute('fill',c);p.setAttribute('class','bit');p.style.setProperty('--dx',dx+'px');p.style.setProperty('--dy',dy+'px');p.style.animationDelay=i*25+'ms';
    g.appendChild(p);svg.appendChild(g);p.addEventListener('animationend',()=>g.remove());setTimeout(()=>g.remove(),1500)}}
function shake(svg){if(!svg)return;svg.classList.remove('shake');void svg.getBoundingClientRect();svg.classList.add('shake')}
const DINO_ACT=['jump','wiggle','stomp','flip'];
function picTap(g,kind,e){const svg=g.closest('svg');let snd=g.getAttribute('data-snd'),bit=g.getAttribute('data-bit'),a=kind,pt=+g.getAttribute('data-pt')||1;
  if(kind==='dino'){const n=+g.getAttribute('data-n')||0,swim=snd==='v_ela',fly=snd==='v_pte',v=snd;g.setAttribute('data-n',n+1);a=DINO_ACT[n%4];
    if(a==='jump'){play(swim?'bubble':fly?'flap':'boing');if((v==='v_trex'||v==='v_spi')&&pt===1)shake(svg)}   /* its own voice, plus a spring */
    else if(a==='wiggle'){snd='giggle';bit=swim?'bubble':'star'}
    else if(a==='stomp'){snd=swim?'splash':fly?'flap':'stomp';if(swim)bit='bubble';if(!swim&&!fly)shake(svg);setTimeout(()=>play(v,pt),swim||fly?250:700)}
    else{snd='tada';bit='star'}}
  if(kind==='erupt'||snd==='thunder')shake(svg);
  [...g.classList].forEach(c=>{if(c.indexOf('a-')===0)g.classList.remove(c)});void g.getBoundingClientRect();g.classList.add('a-'+a);
  play(snd,pt);
  try{const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const z=q.matrixTransform(svg.getScreenCTM().inverse());burst(svg,z.x,z.y,bit)}catch(x){}}

/* touch */
let swiped=false,sx=0,sy=0;
bookEl.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiped=false});
bookEl.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;setTimeout(()=>{swiped=false},400);show(idx+(dx<0?1:-1),dx<0?1:-1)}});
document.addEventListener('click',e=>{if(swiped){swiped=false;return}
  const t=e.target;
  if(t.closest('[data-next]'))return show(idx+1,1);
  if(t.closest('[data-again]'))return show(0,-1);
  if(t.closest('[data-home]'))return goHome();
  const g=t.closest('[data-tap]');if(!g)return;
  const kind=g.getAttribute('data-act');if(kind)return picTap(g,kind,e);
  const snd=g.getAttribute('data-snd'),en=g.getAttribute('data-en'),say=g.getAttribute('data-say');
  g.classList.remove('hit');void g.getBoundingClientRect();g.classList.add('hit');
  play(snd||'pop');
  if(snd==='stomp'||snd==='roar')shake(g.closest('svg'));
  if(cur&&REC[recKey()]&&g.matches('.txt span,.cover h2,.big'))return readPage(snd?450:0);
  const mark=g.matches('span,h1,h2,.say')?g:null;
  if(en)speak(en,'en-US',null,snd?650:150);else if(say)speak(say,'ko-KR',mark,snd?450:0)});
$('prev').onclick=()=>show(idx-1,-1);$('next').onclick=()=>show(idx+1,1);
$('read').onclick=()=>readPage(0);$('home').onclick=goHome;$('auto').onclick=()=>setAuto(!auto);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
addEventListener('resize',()=>{if(cur&&!$('reader').hidden)fit()});
addEventListener('keydown',e=>{if($('reader').hidden)return;if(e.key==='ArrowRight')show(idx+1,1);if(e.key==='ArrowLeft')show(idx-1,-1)});
</script>
</body>
