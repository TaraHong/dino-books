name: TTS trial (branch only)
on:
  push:
    branches: [claude/tts-audio]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install supertonic
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node tools/tts-lines.js | python3 tools/tts.py
          mkdir -p samples
          for v in F1 F2 F3 F4 F5 M1; do
            python3 - "$v" <<'PY'
          import sys
          from supertonic import TTS
          t=TTS(auto_download=True);s=t.get_voice_style(voice_name=sys.argv[1])
          w,_=t.synthesize('티라노사우루스 티노는 힘이 아주 세요. 같이 놀자! 티노가 큰 소리로 외쳤어요.',voice_style=s,lang='ko',speed=0.95,total_steps=12)
          t.save_audio(w,f'samples/{sys.argv[1]}.wav')
          PY
            ffmpeg -y -loglevel error -i samples/$v.wav -ac 1 -c:a aac -b:a 64k samples/$v.m4a && rm samples/$v.wav
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio samples
          git commit -m "Machine-read Korean audio for every page"
          git push
