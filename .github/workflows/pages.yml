name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Make read-aloud audio for any page that has none (kept in the repo)
        continue-on-error: true
        run: |
          n=$(node tools/tts-lines.js | python3 tools/tts.py --check)
          echo "$n pages need audio"
          if [ "$n" != 0 ]; then
            python3 -m venv /tmp/v && . /tmp/v/bin/activate
            pip install -q supertonic
            command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            node tools/tts-lines.js | python tools/tts.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audio
            git commit -m "Machine-read audio for new or changed pages"
            git push || true
          fi
      - name: List recorded audio and stamp the offline cache version
        run: |
          mkdir -p audio
          (cd audio && find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.ogg' -o -iname '*.webm' \) | sed 's|^\./||' | sort | jq -R . | jq -s .) > audio/index.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/" sw.js
          rm -rf .git .github
          cat audio/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
