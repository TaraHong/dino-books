name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: List recorded audio and stamp the offline cache version
        run: |
          mkdir -p audio
          (cd audio && find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.ogg' -o -iname '*.webm' \) | sed 's|^\./||' | sort | jq -R . | jq -s .) > audio/index.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/" sw.js
          rm -rf .git .github
          cat audio/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
